apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calorielens-api
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    # Stable DDNS hostname (ASUS DDNS auto-tracks the dynamic public IP). The iOS
    # Prod build targets this so the app keeps working when the ISP changes the IP.
    # (Legacy static-IP api-prod.121.138.171.230.sslip.io removed 2026-08-14 — its
    # IP is dead and a stuck ACME renewal was blocking cert issuance.)
    - host: xronocore.asuscomm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calorielens-api
                port:
                  number: 80
  tls:
    - hosts:
        - xronocore.asuscomm.com
      secretName: calorielens-api-prod-asuscomm-tls
